<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="__addonRef__-preferences"
  class="main-section glossa-prefs"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <!--
    Controls carry data-pref="<key>" (without the extensions.zotero.glossa
    prefix) and are bound in src/modules/preferences.ts. API keys have no
    data-pref: they live in the login manager.
  -->
  <groupbox>
    <label><html:h2 data-l10n-id="pref-general"></html:h2></label>
    <html:p class="glossa-hint" data-l10n-id="pref-intro"></html:p>
    <html:div class="glossa-layout">
      <html:div class="glossa-profiles">
        <html:button
          id="__addonRef__-profile-save"
          class="glossa-profile-save"
          data-l10n-id="pref-profile-save"
        ></html:button>
        <html:div
          id="__addonRef__-profile-list"
          class="glossa-profile-list"
        ></html:div>
        <html:button
          id="__addonRef__-profile-test-all"
          class="glossa-profile-test"
          data-l10n-id="pref-profile-test-all"
        ></html:button>
      </html:div>

      <html:div class="glossa-config">
        <html:div class="glossa-tabs" role="tablist">
          <html:button
            class="glossa-tab"
            role="tab"
            data-tab="chat"
            data-l10n-id="pref-tab-chat"
          ></html:button>
          <html:button
            class="glossa-tab"
            role="tab"
            data-tab="embed"
            data-l10n-id="pref-tab-embed"
          ></html:button>
          <html:button
            class="glossa-tab"
            role="tab"
            data-tab="other"
            data-l10n-id="pref-tab-other"
          ></html:button>
          <html:button
            class="glossa-tab"
            role="tab"
            data-tab="markdown"
            data-l10n-id="pref-tab-markdown"
          ></html:button>
        </html:div>
        <!-- Chat model -->
        <html:div class="glossa-tabpanel" role="tabpanel" data-panel="chat">
          <html:p
            class="glossa-hint"
            data-l10n-id="pref-connection-help"
          ></html:p>
          <html:div class="glossa-row">
            <html:label
              id="__addonRef__-api-url-label"
              for="__addonRef__-api-url"
            ></html:label>
            <html:div class="glossa-field">
              <html:input
                id="__addonRef__-api-url"
                type="text"
                data-pref="api.url"
              />
              <html:button
                id="__addonRef__-api-url-presets"
                class="glossa-icon-button"
                data-l10n-id="pref-presets"
              ></html:button>
              <html:label class="glossa-switch">
                <html:input id="__addonRef__-api-url-full" type="checkbox" />
                <html:span data-l10n-id="pref-full-url"></html:span>
              </html:label>
            </html:div>
          </html:div>
          <html:div class="glossa-row" id="__addonRef__-api-final-row">
            <html:label data-l10n-id="pref-final-url"></html:label>
            <html:code
              id="__addonRef__-api-final-url"
              class="glossa-final-url"
            ></html:code>
          </html:div>
          <html:div class="glossa-row">
            <html:label
              data-l10n-id="pref-api-key"
              for="__addonRef__-api-key"
            ></html:label>
            <html:div class="glossa-field">
              <html:input id="__addonRef__-api-key" type="password" />
              <html:button
                class="glossa-key-toggle"
                data-for="__addonRef__-api-key"
              ></html:button>
            </html:div>
          </html:div>
          <html:div class="glossa-row">
            <html:label
              data-l10n-id="pref-api-model"
              for="__addonRef__-api-model"
            ></html:label>
            <html:div class="glossa-field">
              <html:input
                id="__addonRef__-api-model"
                type="text"
                data-pref="api.model"
              />
              <html:button
                id="__addonRef__-api-model-list"
                class="glossa-icon-button"
                data-l10n-id="pref-model-list"
              ></html:button>
            </html:div>
          </html:div>
          <html:div class="glossa-row">
            <html:label class="glossa-check">
              <html:input type="checkbox" data-pref="api.temperature.enabled" />
              <html:span data-l10n-id="pref-api-temperature"></html:span>
            </html:label>
            <html:div class="glossa-field">
              <html:input
                type="range"
                min="0"
                max="2"
                step="0.1"
                data-pref="api.temperature"
                data-type="float-string"
              />
              <html:output
                class="glossa-value"
                data-show="api.temperature"
              ></html:output>
            </html:div>
          </html:div>
          <html:div class="glossa-row">
            <html:label class="glossa-check">
              <html:input type="checkbox" data-pref="api.maxTokens.enabled" />
              <html:span data-l10n-id="pref-api-max-tokens"></html:span>
            </html:label>
            <html:div class="glossa-field">
              <html:input
                type="range"
                min="1024"
                max="131072"
                step="1024"
                data-pref="api.maxTokens"
                data-type="int"
              />
              <html:input
                type="number"
                min="1"
                class="glossa-number"
                data-pref="api.maxTokens"
                data-type="int"
              />
            </html:div>
          </html:div>
          <html:div class="glossa-row">
            <html:label class="glossa-check">
              <html:input
                type="checkbox"
                data-pref="api.reasoningEffort.enabled"
              />
              <html:span data-l10n-id="pref-api-effort"></html:span>
            </html:label>
            <html:div class="glossa-field">
              <html:select data-pref="api.reasoningEffort">
                <html:option value="none">none</html:option>
                <html:option value="low">low</html:option>
                <html:option value="medium">medium</html:option>
                <html:option value="high">high</html:option>
                <html:option value="xhigh">xhigh</html:option>
                <html:option value="max">max</html:option>
              </html:select>
            </html:div>
          </html:div>
          <html:p id="__addonRef__-api-hint" class="glossa-hint"></html:p>
          <html:details class="glossa-advanced">
            <html:summary data-l10n-id="pref-advanced"></html:summary>
            <html:div class="glossa-row">
              <html:label data-l10n-id="pref-api-protocol"></html:label>
              <html:div class="glossa-field">
                <html:select data-pref="api.protocol">
                  <html:option value="openai-chat"
                    >OpenAI Chat Completions</html:option
                  >
                  <html:option value="openai-responses"
                    >OpenAI Responses</html:option
                  >
                  <html:option value="anthropic-messages"
                    >Anthropic Messages</html:option
                  >
                </html:select>
              </html:div>
            </html:div>
            <html:div class="glossa-row glossa-row-top">
              <html:label data-l10n-id="pref-system-prompt"></html:label>
              <html:textarea
                id="__addonRef__-api-system"
                rows="4"
                data-pref="api.systemPrompt"
              ></html:textarea>
            </html:div>
            <html:div class="glossa-row glossa-row-top">
              <html:label data-l10n-id="pref-extra-params"></html:label>
              <html:div class="glossa-stack">
                <html:textarea
                  rows="4"
                  class="glossa-code"
                  data-pref="api.extraParams"
                  data-validate="json"
                ></html:textarea>
                <html:span
                  id="__addonRef__-api-extra-error"
                  class="glossa-error"
                ></html:span>
                <html:span
                  class="glossa-hint"
                  data-l10n-id="pref-extra-help"
                ></html:span>
              </html:div>
            </html:div>
          </html:details>
        </html:div>

        <!-- Embeddings -->
        <html:div
          class="glossa-tabpanel"
          role="tabpanel"
          data-panel="embed"
          hidden="hidden"
        >
          <html:p
            class="glossa-hint"
            data-l10n-id="pref-retrieval-help"
          ></html:p>
          <html:div class="glossa-row">
            <html:label class="glossa-check glossa-span">
              <html:input type="checkbox" data-pref="embed.enabled" />
              <html:span data-l10n-id="pref-embed-enabled"></html:span>
            </html:label>
          </html:div>
          <html:div class="glossa-row">
            <html:label
              data-l10n-id="pref-embed-url"
              for="__addonRef__-embed-url"
            ></html:label>
            <html:div class="glossa-field">
              <html:input
                id="__addonRef__-embed-url"
                type="text"
                data-pref="embed.url"
              />
              <html:button
                id="__addonRef__-embed-url-presets"
                class="glossa-icon-button"
                data-l10n-id="pref-presets"
              ></html:button>
            </html:div>
          </html:div>
          <html:p id="__addonRef__-embed-hint" class="glossa-hint"></html:p>
          <html:div class="glossa-row">
            <html:label
              data-l10n-id="pref-embed-key"
              for="__addonRef__-embed-key"
            ></html:label>
            <html:div class="glossa-field">
              <html:input id="__addonRef__-embed-key" type="password" />
              <html:button
                class="glossa-key-toggle"
                data-for="__addonRef__-embed-key"
              ></html:button>
            </html:div>
          </html:div>
          <html:div class="glossa-row">
            <html:label
              data-l10n-id="pref-embed-model"
              for="__addonRef__-embed-model"
            ></html:label>
            <html:div class="glossa-field">
              <html:input
                id="__addonRef__-embed-model"
                type="text"
                data-pref="embed.model"
              />
              <html:button
                id="__addonRef__-embed-model-presets"
                class="glossa-icon-button"
                data-l10n-id="pref-presets"
              ></html:button>
            </html:div>
          </html:div>
          <html:div class="glossa-row">
            <html:label data-l10n-id="pref-embed-batch"></html:label>
            <html:div class="glossa-field">
              <html:input
                type="range"
                min="1"
                max="100"
                step="1"
                data-pref="embed.batchSize"
                data-type="int"
              />
              <html:output
                class="glossa-value"
                data-show="embed.batchSize"
              ></html:output>
            </html:div>
          </html:div>
        </html:div>

        <!-- Other parameters -->
        <html:div
          class="glossa-tabpanel"
          role="tabpanel"
          data-panel="other"
          hidden="hidden"
        >
          <html:p
            class="glossa-hint"
            data-l10n-id="pref-workspace-help"
          ></html:p>
          <html:div class="glossa-row">
            <html:label data-l10n-id="pref-related"></html:label>
            <html:div class="glossa-field">
              <html:input
                type="range"
                min="1"
                max="30"
                step="1"
                data-pref="relatedNumber"
                data-type="int"
              />
              <html:output
                class="glossa-value"
                data-show="relatedNumber"
              ></html:output>
            </html:div>
          </html:div>
          <html:div class="glossa-row">
            <html:label class="glossa-check">
              <html:input type="checkbox" data-pref="chatNumber.enabled" />
              <html:span data-l10n-id="pref-chat-number"></html:span>
            </html:label>
            <html:div class="glossa-field">
              <html:input
                type="range"
                min="1"
                max="99"
                step="1"
                data-pref="chatNumber"
                data-type="int"
              />
              <html:input
                type="number"
                min="1"
                max="999"
                class="glossa-number"
                data-pref="chatNumber"
                data-type="int"
              />
            </html:div>
          </html:div>
          <html:p
            class="glossa-hint"
            data-l10n-id="pref-chat-number-help"
          ></html:p>
          <html:div class="glossa-row">
            <html:label class="glossa-check glossa-span">
              <html:input type="checkbox" data-pref="reader.popup" />
              <html:span data-l10n-id="pref-reader-popup"></html:span>
            </html:label>
          </html:div>
          <html:div class="glossa-row">
            <html:label data-l10n-id="pref-storage"></html:label>
            <html:div class="glossa-field">
              <html:code
                id="__addonRef__-storage-path"
                class="glossa-final-url"
              ></html:code>
              <html:button
                id="__addonRef__-storage-open"
                data-l10n-id="pref-storage-open"
              ></html:button>
            </html:div>
          </html:div>
          <html:h3
            class="glossa-subhead"
            data-l10n-id="pref-glossary-title"
          ></html:h3>
          <html:p
            class="glossa-hint"
            data-l10n-id="pref-glossary-help"
          ></html:p>
          <html:div class="glossa-row">
            <html:span
              id="__addonRef__-glossary-count"
              class="glossa-hint"
            ></html:span>
            <html:div class="glossa-field">
              <html:button
                id="__addonRef__-glossary-open"
                data-l10n-id="pref-glossary-open"
              ></html:button>
            </html:div>
          </html:div>
          <html:h3
            class="glossa-subhead"
            data-l10n-id="pref-translation-title"
          ></html:h3>
          <html:p
            class="glossa-hint"
            data-l10n-id="pref-translation-help"
          ></html:p>
          <html:div class="glossa-row">
            <html:label
              data-l10n-id="pref-translation-draft-profile"
              for="__addonRef__-translation-draft-profile"
            ></html:label>
            <html:div class="glossa-field">
              <html:select id="__addonRef__-translation-draft-profile">
                <html:option
                  value=""
                  data-l10n-id="pref-translation-choose-profile"
                ></html:option>
              </html:select>
            </html:div>
          </html:div>
          <html:div class="glossa-row">
            <html:label
              data-l10n-id="pref-translation-review-profile"
              for="__addonRef__-translation-review-profile"
            ></html:label>
            <html:div class="glossa-field">
              <html:select id="__addonRef__-translation-review-profile">
                <html:option
                  value=""
                  data-l10n-id="pref-translation-choose-profile"
                ></html:option>
              </html:select>
            </html:div>
          </html:div>
          <html:p
            id="__addonRef__-translation-hint"
            class="glossa-error"
          ></html:p>
          <html:h3 class="glossa-subhead" data-l10n-id="pref-tags"></html:h3>
          <html:p class="glossa-hint" data-l10n-id="pref-tags-help"></html:p>
          <html:div id="__addonRef__-tag-list"></html:div>
          <html:div class="glossa-actions">
            <html:button
              id="__addonRef__-tag-add"
              data-l10n-id="pref-tag-add"
            ></html:button>
            <html:button
              id="__addonRef__-tag-reset"
              data-l10n-id="pref-tag-reset"
            ></html:button>
          </html:div>
        </html:div>

        <html:div
          class="glossa-tabpanel"
          role="tabpanel"
          data-panel="markdown"
          hidden="hidden"
        >
          <html:section class="glossa-md-card"
            ><html:h3 data-l10n-id="pref-markdown-provider-title"></html:h3>
            <html:label class="glossa-md-setting"
              ><html:span data-l10n-id="pref-markdown-provider"></html:span
              ><html:select data-pref="markdown.provider"
                ><html:option
                  value="paddleocr-cloud"
                  data-l10n-id="pref-markdown-provider-paddle"
                  >PaddleOCR</html:option
                ><html:option
                  value="mineru-cloud"
                  data-l10n-id="pref-markdown-provider-mineru"
                  >MinerU</html:option
                ></html:select
              ></html:label
            >
            <html:div
              data-markdown-provider="paddleocr-cloud"
              class="glossa-md-provider"
            >
              <html:a
                href="https://aistudio.baidu.com/account/accessToken"
                data-markdown-link="true"
                data-l10n-id="pref-markdown-get-key"
              ></html:a>
              <html:div class="glossa-md-setting"
                ><html:span data-l10n-id="pref-markdown-token"></html:span
                ><html:div class="glossa-field"
                  ><html:input
                    id="__addonRef__-markdown-token"
                    type="password" /><html:button
                    type="button"
                    class="glossa-key-toggle"
                    data-for="__addonRef__-markdown-token"
                  ></html:button></html:div></html:div
              ><html:label class="glossa-md-setting"
                ><html:span data-l10n-id="pref-markdown-endpoint"></html:span
                ><html:input
                  type="text"
                  data-pref="markdown.cloud.endpoint" /></html:label
              ><html:label class="glossa-md-setting"
                ><html:span data-l10n-id="pref-markdown-model"></html:span
                ><html:input
                  type="text"
                  data-pref="markdown.cloud.model" /></html:label
              ><html:div class="glossa-md-actions"
                ><html:button
                  type="button"
                  id="__addonRef__-markdown-test"
                  data-l10n-id="pref-markdown-test"
                ></html:button
                ><html:span
                  id="__addonRef__-markdown-test-result"
                  role="status"
                  class="glossa-hint"
                ></html:span
              ></html:div>
            </html:div>
            <html:div
              data-markdown-provider="mineru-cloud"
              class="glossa-md-provider"
              hidden="hidden"
            >
              <html:a
                href="https://mineru.net/apiManage/token"
                data-markdown-link="true"
                data-l10n-id="pref-markdown-get-key"
              ></html:a>
              <html:div class="glossa-md-setting"
                ><html:span data-l10n-id="pref-markdown-token"></html:span
                ><html:div class="glossa-field"
                  ><html:input
                    id="__addonRef__-markdown-mineru-token"
                    type="password" /><html:button
                    type="button"
                    class="glossa-key-toggle"
                    data-for="__addonRef__-markdown-mineru-token"
                  ></html:button></html:div></html:div
              ><html:label class="glossa-md-setting"
                ><html:span data-l10n-id="pref-markdown-base-url"></html:span
                ><html:input type="text" data-pref="markdown.mineru.endpoint"
              /></html:label>
              <html:details class="glossa-md-advanced"
                ><html:summary
                  data-l10n-id="pref-markdown-advanced"
                ></html:summary>
                <html:label class="glossa-md-setting"
                  ><html:span
                    data-l10n-id="pref-markdown-model-version"
                  ></html:span
                  ><html:select data-pref="markdown.mineru.modelVersion"
                    ><html:option
                      value="vlm"
                      data-l10n-id="pref-markdown-mineru-vlm"
                      >VLM</html:option
                    ><html:option
                      value="pipeline"
                      data-l10n-id="pref-markdown-mineru-pipeline"
                      >Pipeline</html:option
                    ></html:select
                  ></html:label
                ><html:label class="glossa-md-setting"
                  ><html:span data-l10n-id="pref-markdown-language"></html:span
                  ><html:select data-pref="markdown.mineru.language"
                    ><html:option
                      value="ch"
                      data-l10n-id="pref-markdown-lang-ch"
                      >中文 (ch)</html:option
                    ><html:option
                      value="en"
                      data-l10n-id="pref-markdown-lang-en"
                      >English (en)</html:option
                    ></html:select
                  ></html:label
                >
                <html:label class="glossa-check"
                  ><html:input
                    type="checkbox"
                    data-pref="markdown.mineru.isOcr" /><html:span
                    data-l10n-id="pref-markdown-ocr"
                  ></html:span></html:label
                ><html:label class="glossa-check"
                  ><html:input
                    type="checkbox"
                    data-pref="markdown.mineru.selfHosted" /><html:span
                    data-l10n-id="pref-markdown-self-hosted"
                  ></html:span
                ></html:label> </html:details
              ><html:div class="glossa-md-actions"
                ><html:button
                  type="button"
                  id="__addonRef__-markdown-mineru-test"
                  data-l10n-id="pref-markdown-test"
                ></html:button
                ><html:span
                  id="__addonRef__-markdown-mineru-test-result"
                  role="status"
                  class="glossa-hint"
                ></html:span></html:div></html:div
          ></html:section>
          <html:section class="glossa-md-card"
            ><html:h3 data-l10n-id="pref-markdown-automation-title"></html:h3>
            <html:label class="glossa-check"
              ><html:input
                type="checkbox"
                data-pref="markdown.enabled" /><html:span
                data-l10n-id="pref-markdown-enabled"
              ></html:span></html:label
            ><html:label class="glossa-check"
              ><html:input
                type="checkbox"
                data-pref="markdown.autoOnImport" /><html:span
                data-l10n-id="pref-markdown-auto-import"
              ></html:span></html:label
            ><html:label class="glossa-check"
              ><html:input
                type="checkbox"
                data-pref="markdown.readContext" /><html:span
                data-l10n-id="pref-markdown-read-context"
              ></html:span
            ></html:label>
            <html:div class="glossa-md-actions"
              ><html:button
                type="button"
                id="__addonRef__-markdown-convert-current"
                data-l10n-id="pref-markdown-convert-current"
              ></html:button
            ></html:div> </html:section
        ></html:div>
      </html:div>
    </html:div>

    <html:div class="glossa-test">
      <html:h3 class="glossa-subhead" data-l10n-id="pref-test-title"></html:h3>
      <html:div
        id="__addonRef__-test-output"
        class="glossa-test-output"
      ></html:div>
      <html:div class="glossa-actions">
        <html:button
          id="__addonRef__-test-run"
          class="glossa-primary"
          data-l10n-id="pref-test-run"
        ></html:button>
        <html:button
          id="__addonRef__-test-cancel"
          hidden="hidden"
          data-l10n-id="pref-test-cancel"
        ></html:button>
        <html:button
          id="__addonRef__-test-copy"
          hidden="hidden"
          data-l10n-id="pref-test-copy"
        ></html:button>
        <html:span class="glossa-spacer"></html:span>
        <html:button
          id="__addonRef__-test-help"
          data-l10n-id="pref-test-help"
        ></html:button>
      </html:div>
    </html:div>
    <html:p class="glossa-hint" data-l10n-id="pref-key-note"></html:p>
  </groupbox>
  <html:p data-l10n-id="pref-license-note"></html:p>
</vbox>
